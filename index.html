<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blue Rush</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#09284b,#061326);color:#eefaff;font-family:system-ui,Arial;display:grid;place-items:center;padding:16px}main{width:min(960px,100%)}header{display:flex;align-items:center;gap:12px;margin-bottom:12px}h1{margin:0;letter-spacing:3px}header p{margin:3px 0;color:#9adfff;font-size:12px}.panel{border:3px solid #69d5ff;background:#0b2948;padding:8px;box-shadow:7px 7px #020914}.hud{display:flex;justify-content:space-between;padding:4px 6px 10px;gap:8px;flex-wrap:wrap}.hud strong{display:block}.gold{color:#ffdf57}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#70dafa;border:2px solid #d5f7ff;image-rendering:pixelated}.controls{display:flex;justify-content:center;gap:12px;margin:14px 0}.controls button,#start{font:inherit;font-weight:900;padding:12px 20px;border:2px solid #69d5ff;background:#17466d;color:white;cursor:pointer;touch-action:none}.controls .jump,#start{background:#ffdf57;color:#092747;border-color:#fff0a8}.help{text-align:center;color:#b9d9ed;font-size:12px}.stage{position:relative;width:100%}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;z-index:5;pointer-events:auto;background:rgba(3,20,40,.12)}.overlay div{display:inline-block;background:#082344;border:3px solid #a1e8ff;padding:16px;max-width:90%}.overlay p{font-size:13px}@media(max-width:500px){.controls{gap:6px}.controls button{flex:1;padding:12px 5px}.overlay{padding:8px}.overlay div{padding:12px}}
</style></head><body><main><header><div style="font-size:34px">💠</div><div><h1>BLUE RUSH</h1><p>PROTOTIPO NUEVO · CORRE Y SALTA</p></div></header><section class="panel"><div class="hud"><div>PUNTOS<strong id="score">000000</strong></div><div class="gold">ANILLOS<strong id="rings">00</strong></div><div>VIDAS<strong id="lives">3</strong></div><div>ESTADO<strong id="status">LISTO</strong></div></div><div class="stage"><canvas id="game" width="960" height="540"></canvas><div class="overlay" id="overlay"><div><h2 id="title">¡A correr!</h2><p id="msg">Muévete, salta sobre los huecos y recoge anillos.</p><button id="start" type="button">JUGAR</button></div></div></div></section><div class="controls"><button data-k="left">◀ IZQUIERDA</button><button data-k="jump" class="jump">SALTAR ▲</button><button data-k="right">DERECHA ▶</button></div><p class="help">Teclado: ← → o A/D para moverte · ESPACIO, W o ↑ para saltar. También puedes mantener pulsados los botones.</p></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),$=s=>document.querySelector(s),keys={left:false,right:false,jump:false};let active=false,px=80,py=382,vy=0,vx=0,ground=true,cam=0,score=0,rings=0,lives=3,last=0,buffer=0,coyote=0;const floor=430,world=3600,platforms=[[0,430,600],[680,430,540],[1300,430,520],[1900,430,570],[2550,430,500],[3130,430,470],[240,345,140],[430,295,130],[760,350,140],[970,300,130],[1390,345,140],[1590,295,130],[1980,350,140],[2190,295,130],[2620,350,140],[2820,295,130],[3210,345,140],[3390,295,130]],rs=[];for(let a of [[140,380,8],[260,305,5],[440,255,5],[730,380,8],[990,260,5],[1350,380,8],[1600,255,5],[1950,380,8],[2200,255,5],[2600,380,8],[2850,255,5],[3180,380,8],[3420,255,5]])for(let i=0;i<a[2];i++)rs.push({x:a[0]+i*29,y:a[1],got:false});
function reset(){active=true;px=80;py=382;vx=vy=cam=score=rings=0;lives=3;ground=true;buffer=coyote=0;rs.forEach(r=>r.got=false);$('overlay').style.display='none';$('status').textContent='JUGANDO';hud()}
function hud(){$('#score').textContent=String(score).padStart(6,'0');$('#rings').textContent=String(rings).padStart(2,'0');$('#lives').textContent=lives}
$('#start').addEventListener('click',e=>{e.preventDefault();reset()});function set(k,v){keys[k]=v;if(k==='jump'&&v)buffer=.16}
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();set(k,true);b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>set(k,false)});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','w'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')set('left',true);if(k==='arrowright'||k==='d')set('right',true);if((k===' '||k==='arrowup'||k==='w')&&!keys.jump)set('jump',true);if(!active&&k==='enter')reset()});window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')set('left',false);if(k==='arrowright'||k==='d')set('right',false);if(k===' '||k==='arrowup'||k==='w')set('jump',false)});window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});
function update(dt){if(!active)return;if(keys.left)vx-=28*dt;if(keys.right)vx+=28*dt;if(!keys.left&&!keys.right)vx*=Math.pow((ground ? 0.78 : 0.98),dt*60);vx=Math.max(-7.5,Math.min(7.5,vx));if(ground)coyote=.11;else coyote=Math.max(0,coyote-dt);buffer=Math.max(0,buffer-dt);if(buffer&&coyote){vy=-11.5;ground=false;coyote=buffer=0}if(!ground)vy+=27*dt;let old=py;px=Math.max(0,Math.min(world-34,px+vx));py+=vy;ground=false;for(let p of platforms){if(px+30>p[0]&&px<p[0]+p[2]&&old+48<=p[1]+5&&py+48>=p[1]&&vy>=0){py=p[1]-48;vy=0;ground=true}}for(let r of rs)if(!r.got&&Math.hypot(px+17-r.x,py+24-r.y)<27){r.got=true;rings++;score+=100}if(py>600){lives--;if(lives<=0){finish('¡Prueba terminada!','Te quedaste sin vidas. Reinicia para intentarlo otra vez.');return}px=Math.max(80,px-130);py=330;vy=0;vx=0;rings=0}if(px>world-100){finish('¡Bien hecho!','Llegaste a la meta. El movimiento y el salto están listos para seguir mejorando.');return}cam=Math.max(0,Math.min(world-c.width,px-220));hud()}
function finish(t,m){active=false;$('#title').textContent=t;$('#msg').textContent=m;$('#start').textContent='JUGAR OTRA VEZ';$('#overlay').style.display='block';$('#status').textContent='FIN'}
function draw(){let g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#45b9f5');g.addColorStop(1,'#d4f7ff');x.fillStyle=g;x.fillRect(0,0,960,540);for(let i=0;i<7;i++){let a=(i*180-cam*.2)%(1100)-70;x.fillStyle='#fff';x.fillRect(a,80+(i%3)*48,60,16);x.fillRect(a+18,68+(i%3)*48,32,12)}for(let i=0;i<7;i++){let a=(i*200-cam*.12)%(1180)-80;x.fillStyle='#72c99b';x.beginPath();x.moveTo(a,430);x.lineTo(a+90,310);x.lineTo(a+190,430);x.fill()}for(let p of platforms){let a=p[0]-cam;if(a+p[2]<0||a>960)continue;x.fillStyle='#965c38';x.fillRect(a,p[1],p[2],110);x.fillStyle='#38d35d';x.fillRect(a,p[1],p[2],12);x.fillStyle='#a4f26a';for(let z=a;z<a+p[2];z+=28){x.fillRect(z,p[1]+22,14,14);x.fillStyle='#77442f';x.fillRect(z+14,p[1]+36,14,14);x.fillStyle='#a4f26a'}}for(let r of rs)if(!r.got){x.strokeStyle='#ffbd27';x.lineWidth=5;x.beginPath();x.ellipse(r.x-cam,r.y,8,12,0,0,Math.PI*2);x.stroke()}x.save();x.translate(px-cam+17,py+24);if(vx<0)x.scale(-1,1);x.fillStyle='#0754b8';x.beginPath();x.moveTo(-15,-5);x.lineTo(-30,-17);x.lineTo(-25,0);x.lineTo(-34,8);x.lineTo(-19,10);x.lineTo(-22,22);x.lineTo(-5,17);x.lineTo(10,18);x.lineTo(18,8);x.lineTo(12,-10);x.lineTo(0,-22);x.closePath();x.fill();x.fillStyle='#fff';x.fillRect(5,-9,6,10);x.fillStyle='#17294b';x.fillRect(9,-7,3,6);x.fillStyle='#f3a77c';x.fillRect(13,2,8,5);x.fillStyle='#fff';x.fillRect(-12,19,14,5);x.fillRect(6,19,14,5);x.restore();let gx=world-65-cam;if(gx>-20&&gx<960){x.fillStyle='#fff';x.fillRect(gx,290,5,140);x.fillStyle='#ff5361';x.fillRect(gx+5,295,65,22);x.fillRect(gx+5,317,42,14)}}
function loop(now){let dt=Math.min((now-last)/1000||0,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
